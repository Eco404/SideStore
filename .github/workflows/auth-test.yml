name: Authentication Test IPA

on:
  push:
    branches: [fix/apple-auth]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare Build Metadata
        run: |
          set -euo pipefail
          mkdir -p build/logs
          python3 -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          BASE_VERSION=$(.venv-ci/bin/python scripts/ci/workflow.py get-marketing-version)
          AUTH_VERSION="${BASE_VERSION}-auth.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:8}"
          .venv-ci/bin/python scripts/ci/workflow.py set-marketing-version "$AUTH_VERSION"
          echo "MARKETING_VERSION=$AUTH_VERSION" >> "$GITHUB_ENV"
          {
            echo "Version: $AUTH_VERSION"
            echo "SideStore: $GITHUB_SHA"
            git submodule status --recursive
          } | tee build/logs/revisions.log

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install Build Tools
        run: |
          set -euo pipefail
          brew install ldid xcbeautify 2>&1 | tee build/logs/tools.log
          xcodebuild -version | tee -a build/logs/tools.log

      - name: Test Authentication Protocol
        run: |
          set -euo pipefail
          bash scripts/tests/run-auth-tests.sh 2>&1 | tee build/logs/auth-tests.log

      - name: Archive
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES make -B build 2>&1 | tee build/logs/build.log | xcbeautify --renderer github-actions

      - name: Preserve Entitlements
        run: |
          set -euo pipefail
          make fakesign 2>&1 | tee build/logs/fakesign.log

      - name: Package IPA
        run: |
          set -euo pipefail
          make ipa 2>&1 | tee build/logs/package.log
          if [[ -d SideStore.xcarchive/dSYMs ]]; then
            zip -r -9 SideStore.dSYMs.zip SideStore.xcarchive/dSYMs 2>&1 | tee -a build/logs/package.log
          fi

      - name: Verify IPA
        run: |
          set -euo pipefail
          python scripts/ci/verify_auth_ipa.py SideStore.ipa "$MARKETING_VERSION" 2>&1 | tee build/logs/verify.log
          shasum -a 256 SideStore.ipa | tee -a build/logs/verify.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}
          path: SideStore.ipa
          if-no-files-found: error

      - name: Upload Debug Symbols
        if: ${{ success() && hashFiles('SideStore.dSYMs.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}-dSYMs
          path: SideStore.dSYMs.zip
          if-no-files-found: error

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-auth-${{ github.run_number }}-logs
          path: build/logs
          if-no-files-found: warn
